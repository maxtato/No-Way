<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FAF2DC">
<title>NO WAY! — à vue de nez</title>
<link rel="icon" href="icone-32.png" sizes="32x32">
<link rel="icon" href="icone-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="NO WAY!">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --papier:#FAF2DC; --rouge:#E03B26; --jaune:#F2C64B; --moutarde:#E6A93C;
  --encre:#2A3229; --vert:#79A257; --olive:#8A9A48; --corail:#E8897A;
  --nuit:#2E4257; --petrole:#2C6E7F; --turquoise:#4FA8A0; --brique:#B5533C;
  --sable:#E7D5AC;
  --f-disp:'Grandstander',system-ui,sans-serif; --f-body:'Grandstander',system-ui,sans-serif;
  --disp-scale:.94; --disp-ls:-.01em; --disp-w:800; --hand-w:600;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* overflow:hidden — sinon le navigateur fait défiler la page pour suivre un
   bouton focalisé quand un panneau ressort de l'écran */
html,body{height:100%;overflow:hidden}
body{font-family:var(--f-body);color:var(--encre);background:var(--papier);
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2{font-family:var(--f-disp);font-weight:var(--disp-w);letter-spacing:var(--disp-ls)}

/* overflow:clip et non hidden : un conteneur « hidden » reste défilable par
   programme, et le navigateur le décale pour suivre un bouton focalisé */
.app{position:relative;height:100dvh;overflow:clip;max-width:520px;margin:0 auto;background:var(--papier);
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 15px calc(env(safe-area-inset-bottom) + 14px)}
svg.fr{position:absolute !important;overflow:visible;pointer-events:none;z-index:0}
.framed{position:relative}
.framed > *:not(svg){position:relative;z-index:1}

/* ---------- barre du haut ---------- */
.top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex:none}
.logo{font-family:var(--f-disp);font-size:calc(30px * var(--disp-scale));font-weight:var(--disp-w);
  color:var(--rouge);transform:rotate(-2deg);line-height:.9;filter:url(#peint-fort);letter-spacing:-.02em}
.logo em{font-family:var(--f-disp);font-weight:var(--hand-w);font-style:italic;font-size:13px;
  color:var(--encre);display:block;transform:rotate(1.6deg);opacity:.85;letter-spacing:.03em;white-space:nowrap}
.mini{width:36px;height:36px;display:grid;place-items:center;position:relative;flex:none;
  transform:rotate(-2deg);text-decoration:none;color:inherit;margin-left:auto}
.mini:active{transform:rotate(-2deg) translate(2px,2px)}
.mini svg:not(.fr){position:relative;z-index:1;display:block}

/* tableau des scores en cours de partie */
.board{display:flex;gap:6px;flex:none;margin-bottom:9px;flex-wrap:wrap}
.board .j{position:relative;padding:4px 10px;font-family:var(--f-disp);font-size:13px;font-weight:800;
  display:flex;align-items:center;gap:6px;transform:rotate(-.6deg)}
.board .j i{width:11px;height:11px;border-radius:50%;background:var(--pc);
  border:1.6px solid var(--encre);flex:none;font-style:normal}
.board .j.tour{transform:rotate(-.6deg) scale(1.06)}
.board .j b{font-variant-numeric:tabular-nums}

.segs{display:flex;gap:3px;flex:none;margin-bottom:10px;transform:rotate(-.5deg)}
.segs b{flex:1;height:9px;position:relative}

/* ---------- question ---------- */
.wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.ligne{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex:none}
.cat{font-family:var(--f-disp);font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--papier);padding:6px 15px;display:flex;align-items:center;
  transform:rotate(-1.6deg);filter:url(#peint);
  border-radius:13px 10px 12px 11px/11px 13px 10px 12px}
.qui{margin-left:auto;font-family:var(--f-disp);font-size:15px;font-weight:800;
  color:var(--papier);background:var(--pc,#E03B26);padding:6px 14px;transform:rotate(1.4deg);
  filter:url(#peint);border-radius:11px 13px 10px 12px/12px 10px 13px 11px;white-space:nowrap}
.q-card{position:relative;padding:22px 20px;transform:rotate(-.9deg);margin:0 4px 0 2px;flex:none}
.q-card p{font-family:var(--f-disp);font-size:calc(20px * var(--disp-scale));line-height:1.22;
  font-weight:var(--disp-w);letter-spacing:var(--disp-ls);filter:url(#peint)}
.sp{flex:1 1 0;min-height:6px}

.val{text-align:center;font-family:var(--f-disp);font-weight:800;line-height:.92;
  color:var(--rouge);filter:url(#peint-fort);font-size:52px;transform:rotate(-1deg);transition:color .2s}
.val small{display:block;font-family:var(--f-disp);font-style:italic;font-weight:var(--hand-w);
  font-size:15px;color:var(--encre);margin-top:3px;filter:none;letter-spacing:.02em}

/* ---------- curseur ---------- */
.slider{position:relative;height:86px;margin:6px 2px 0;touch-action:none;cursor:grab}
.slider:active{cursor:grabbing}
.slider svg.track{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.knob{position:absolute;top:30px;width:44px;height:44px;margin-left:-22px;pointer-events:none;
  display:grid;place-items:center;transition:transform .08s}
.knob svg{position:absolute;inset:-6px;width:56px;height:56px;overflow:visible}
.knob.cache{opacity:0}
.slider.grab .knob{transform:scale(1.12)}
.truth{position:absolute;top:14px;width:2px;height:0;margin-left:-1px;pointer-events:none;opacity:0;
  background:var(--vert);box-shadow:2px 0 0 rgba(42,50,41,.55)}
.truth.on{opacity:1;height:44px;animation:drop .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes drop{from{transform:translateY(-26px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.truth i{position:absolute;left:50%;top:-19px;transform:translateX(-50%) rotate(-4deg);
  font-family:var(--f-disp);font-style:normal;font-weight:800;font-size:13px;color:var(--papier);
  background:var(--vert);padding:2px 8px;white-space:nowrap;filter:url(#peint);
  border-radius:11px 8px 10px 9px/9px 11px 8px 10px}
/* pastilles des joueurs, posées sur la piste à la révélation */
.marks{position:absolute;inset:0;pointer-events:none}
.mark{position:absolute;top:45px;width:0;height:0;opacity:0;animation:pin .34s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.mark i{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:15px;height:15px;
  border-radius:50%;background:var(--pc);border:2px solid var(--encre);font-style:normal}
.mark b{position:absolute;left:50%;top:12px;transform:translateX(-50%) rotate(-3deg);
  font-family:var(--f-disp);font-size:10.5px;font-weight:800;color:var(--encre);white-space:nowrap}
.mark.gagne i{width:19px;height:19px;box-shadow:0 0 0 3px rgba(121,162,87,.45)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-disp);font-style:italic;
  font-weight:var(--hand-w);font-size:12.5px;opacity:.6;margin:-2px 4px 0}

.cta{display:block;width:100%;text-align:center;position:relative;color:var(--papier);
  font-family:var(--f-disp);font-size:calc(19px * var(--disp-scale));letter-spacing:var(--disp-ls);
  font-weight:var(--disp-w);padding:15px;transform:rotate(-.7deg);flex:none;margin-top:10px}
.cta:active{transform:rotate(-.7deg) translate(3px,3px)}

/* ---------- révélation ---------- */
.explain{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--papier);visibility:hidden;
  display:flex;flex-direction:column;padding:15px 16px calc(env(safe-area-inset-bottom) + 14px);
  transform:translateY(112%);transition:transform .26s cubic-bezier(.2,.9,.3,1);max-height:82%}
.explain.on{transform:translateY(0);visibility:visible}
.explain .verdict{font-family:var(--f-disp);font-size:calc(20px * var(--disp-scale));
  font-weight:var(--disp-w);transform:rotate(-.9deg);margin-bottom:8px;color:var(--vert)}
.classement{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;flex:none}
.classement .r{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.classement .r i{width:12px;height:12px;border-radius:50%;background:var(--pc);
  border:1.7px solid var(--encre);flex:none;font-style:normal}
.classement .r .ec{margin-left:auto;font-family:var(--f-disp);font-style:italic;
  font-weight:var(--hand-w);font-size:13px;opacity:.75;font-variant-numeric:tabular-nums}
.classement .r .pt{font-family:var(--f-disp);font-weight:800;font-size:14px;color:var(--vert);min-width:26px;text-align:right}
.classement .r.perdu{opacity:.55}
.explain p{font-size:14px;line-height:1.45;margin-bottom:10px;overflow-y:auto;min-height:0}

.stamp{position:absolute;left:50%;top:36%;z-index:20;font-family:var(--f-disp);font-weight:800;
  font-size:clamp(44px,14vw,82px);color:var(--rouge);letter-spacing:-.03em;line-height:.82;
  text-align:center;white-space:nowrap;transform:translate(-50%,-50%) rotate(-9deg) scale(2.6);
  opacity:0;pointer-events:none;filter:url(#peint-fort);text-shadow:3px 5px 0 var(--encre)}
.stamp.on{animation:stamp 1.15s cubic-bezier(.2,1.35,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-26deg) scale(2.6)}
  15%{opacity:1;transform:translate(-50%,-50%) rotate(-9deg) scale(.9)}
  24%{transform:translate(-50%,-50%) rotate(-9deg) scale(1.05)}
  34%{transform:translate(-50%,-50%) rotate(-9deg) scale(1)}
  72%{opacity:1;transform:translate(-50%,-50%) rotate(-9deg) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(-9deg) scale(1.03)}}

/* ---------- écrans pleins ---------- */
.screen{position:absolute;inset:0;z-index:60;background:var(--papier);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:22px 20px calc(env(safe-area-inset-bottom) + 16px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);visibility:hidden;overflow-y:auto}
.screen.on{transform:translateY(0);visibility:visible}
.screen h2{font-size:calc(28px * var(--disp-scale));transform:rotate(-1.2deg);margin-bottom:6px;filter:url(#peint)}

/* accueil */
#setupScreen{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 26px)}
#setupScreen .logo{font-size:calc(44px * var(--disp-scale));margin-bottom:4px}
#setupScreen .logo em{font-size:15px}
.pitch{font-family:var(--f-disp);font-style:italic;font-weight:var(--hand-w);font-size:15px;
  line-height:1.4;max-width:300px;margin:12px 0 20px;opacity:.85;text-wrap:balance}
.players{display:flex;flex-direction:column;gap:9px;width:100%;max-width:330px;margin-bottom:12px}
.pl{display:flex;align-items:center;gap:9px;position:relative;padding:9px 11px}
.pl i{width:15px;height:15px;border-radius:50%;background:var(--pc);border:2px solid var(--encre);
  flex:none;font-style:normal}
.pl input{flex:1;min-width:0;border:none;background:none;font-family:var(--f-disp);font-weight:800;
  font-size:16px;color:var(--encre);outline:none;padding:2px 0}
.pl .del{width:26px;height:26px;flex:none;display:grid;place-items:center;opacity:.5;font-size:17px;
  font-family:var(--f-disp);line-height:1}
.pl .del:hover,.pl .del:focus-visible{opacity:1}
.addBtn{font-family:var(--f-disp);font-style:italic;font-weight:var(--hand-w);font-size:15px;
  color:var(--petrole);padding:6px 4px;margin-bottom:16px}
.addBtn[disabled]{opacity:.35;pointer-events:none}
.manches{display:flex;align-items:center;gap:8px;margin-bottom:20px;
  font-family:var(--f-disp);font-style:italic;font-weight:var(--hand-w);font-size:14px}
.manches button{position:relative;padding:5px 13px;font-family:var(--f-disp);font-style:normal;
  font-weight:800;font-size:15px;transform:rotate(-1deg)}
#setupScreen .cta,#passScreen .cta,#resultScreen .cta{width:100%;max-width:330px}

/* passage de main */
#passScreen .qui{margin:0 0 18px;font-size:22px;padding:10px 22px}
#passScreen .consigne{font-family:var(--f-disp);font-style:italic;font-weight:var(--hand-w);
  font-size:15px;opacity:.8;margin-bottom:26px;max-width:280px;text-wrap:balance}

/* fin de partie */
.podium{display:flex;flex-direction:column;gap:8px;width:100%;max-width:330px;margin:14px 0 6px}
.podium .r{display:flex;align-items:center;gap:10px;position:relative;padding:10px 13px;
  font-family:var(--f-disp);font-weight:800;font-size:16px}
.podium .r i{width:14px;height:14px;border-radius:50%;background:var(--pc);
  border:2px solid var(--encre);flex:none;font-style:normal}
.podium .r .sc{margin-left:auto;font-variant-numeric:tabular-nums}
.podium .r .rg{font-family:var(--f-disp);font-style:italic;font-weight:var(--hand-w);
  font-size:14px;opacity:.6;min-width:20px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;width:12px;height:14px;top:-24px;background:var(--c,#E03B26);
  border-radius:2px 3px 2px 3px;animation:fall linear forwards;filter:url(#peint)}
.confetti i::after{content:'';position:absolute;inset:0;border:1.6px solid var(--encre);
  border-radius:3px 2px 3px 2px;transform:translate(-1.6px,-1.4px)}
@keyframes fall{to{transform:translateY(110vh) rotate(680deg)}}

@media (max-height:730px){
  .q-card{padding:16px 17px}
  .q-card p{font-size:calc(17px * var(--disp-scale))}
  .val{font-size:42px}
  .slider{height:76px}
  .knob{top:24px}
  .cta{padding:12px}
  #setupScreen .logo{font-size:calc(36px * var(--disp-scale))}
  .pitch{margin:8px 0 14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.09s !important}}
:focus-visible{outline:3px solid var(--petrole);outline-offset:3px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="peint" x="-8%" y="-12%" width="116%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="3" seed="9" result="b"/>
    <feDisplacementMap in="SourceGraphic" in2="b" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="peint-fort" x="-10%" y="-14%" width="120%" height="128%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="4" result="b2"/>
    <feDisplacementMap in="SourceGraphic" in2="b2" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<div class="app">
  <!-- ======== jeu ======== -->
  <div class="top">
    <div class="logo">NO WAY!<em>à vue de nez</em></div>
    <a class="mini" id="homeBtn" href="index.html" aria-label="Retour au jeu de base" title="Retour au jeu de base"></a>
  </div>
  <div class="board" id="board"></div>
  <div class="segs" id="segs"></div>

  <div class="wrap">
    <div class="ligne">
      <div class="cat" id="cat">Terre</div>
      <div class="qui" id="qui">Alice</div>
    </div>
    <div class="q-card" id="qCard"><p id="qText">…</p></div>
    <i class="sp"></i>
    <div class="val" id="val">0<small>unité</small></div>
    <div class="slider" id="slider">
      <svg class="track" id="track" aria-hidden="true"></svg>
      <div class="truth" id="truth"><i id="truthLbl"></i></div>
      <div class="marks" id="marks"></div>
      <div class="knob" id="knob"></div>
    </div>
    <div class="scale"><span id="sMin">0</span><span id="sMax">100</span></div>
    <i class="sp"></i>
    <button class="cta" id="okBtn"><span class="lbl">Valider</span></button>
  </div>

  <div class="stamp" id="stamp">NO WAY!</div>

  <div class="explain" id="explain">
    <div class="verdict" id="verdict">Alice remporte la manche</div>
    <div class="classement" id="classement"></div>
    <p id="explainText"></p>
    <button class="cta" id="nextBtn"><span class="lbl">Manche suivante</span></button>
  </div>

  <!-- ======== accueil ======== -->
  <section class="screen on" id="setupScreen">
    <div class="logo">NO WAY!<em>à vue de nez</em></div>
    <p class="pitch">Chacun son tour, placez le curseur sur l'échelle.<br>Le plus proche du vrai chiffre remporte la manche.</p>
    <div class="players" id="playerList"></div>
    <button class="addBtn" id="addBtn">+ ajouter un joueur</button>
    <div class="manches">
      <span>manches :</span>
      <button data-m="5"><span>5</span></button><button data-m="8"><span>8</span></button><button data-m="12"><span>12</span></button>
    </div>
    <button class="cta" id="startBtn"><span class="lbl">C'est parti</span></button>
  </section>

  <!-- ======== passage de main ======== -->
  <section class="screen" id="passScreen">
    <div class="qui" id="passQui">Bob</div>
    <p class="consigne">Passe l'appareil — sans regarder le curseur du joueur précédent.</p>
    <button class="cta" id="passBtn"><span class="lbl">Je suis prêt</span></button>
  </section>

  <!-- ======== fin de partie ======== -->
  <section class="screen" id="resultScreen">
    <div class="confetti" id="confetti"></div>
    <h2 id="resultTitle">Alice gagne !</h2>
    <div class="podium" id="podium"></div>
    <button class="cta" id="againBtn"><span class="lbl">Rejouer</span></button>
  </section>
</div>

<script src="questions-curseur.js"></script>
<script>
/* =========================================================
   NO WAY! — mode curseur, en duel
   Chacun son tour place le curseur ; le plus proche du vrai
   chiffre remporte la manche. Deux joueurs par défaut, six au plus.
   ========================================================= */
const $=id=>document.getElementById(id);
function rnd(s){const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function wob(s,a){return (rnd(s)-.5)*2*a}

function scribbleCircle(cx,cy,r,seed,amp=3.4,steps=17){
  const ox=1+wob(seed+1.7,.11),oy=1+wob(seed+5.3,.11),tilt=wob(seed+9.1,.55),p=[];
  for(let i=0;i<steps;i++){const a=i/steps*Math.PI*2+tilt,rr=r+wob(seed+i*3.7,amp);
    p.push([cx+Math.cos(a)*rr*ox,cy+Math.sin(a)*rr*oy]);}
  let d=`M ${(p[0][0]+p[steps-1][0])/2} ${(p[0][1]+p[steps-1][1])/2}`;
  for(let i=0;i<steps;i++){const c=p[i],n=p[(i+1)%steps];
    d+=` Q ${c[0].toFixed(1)} ${c[1].toFixed(1)} ${((c[0]+n[0])/2).toFixed(1)} ${((c[1]+n[1])/2).toFixed(1)}`;}
  return d+' Z';
}
function scribbleRound(w,h,r,seed,amp=1.2){
  r=Math.max(2,Math.min(r,w/2,h/2));const pt=[];let k=0;
  const arc=(cx,cy,a0,a1)=>{const n=5;for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;
    pt.push([cx+Math.cos(a)*(r+wob(seed+k*2.7,amp)),cy+Math.sin(a)*(r+wob(seed+k*3.9,amp))]);k++;}};
  const seg=(x0,y0,x1,y1)=>{const L=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.min(5,Math.round(L/34)));
    for(let i=1;i<n;i++){const t=i/n;pt.push([x0+(x1-x0)*t+wob(seed+k*2.3,amp),y0+(y1-y0)*t+wob(seed+k*3.1,amp)]);k++;}};
  arc(w-r,r,-Math.PI/2,0);seg(w,r,w,h-r);arc(w-r,h-r,0,Math.PI/2);seg(w-r,h,r,h);
  arc(r,h-r,Math.PI/2,Math.PI);seg(0,h-r,0,r);arc(r,r,Math.PI,Math.PI*1.5);seg(r,0,w-r,0);
  let d=`M ${((pt[0][0]+pt[pt.length-1][0])/2).toFixed(1)} ${((pt[0][1]+pt[pt.length-1][1])/2).toFixed(1)}`;
  for(let i=0;i<pt.length;i++){const c=pt[i],n2=pt[(i+1)%pt.length];
    d+=` Q ${c[0].toFixed(1)} ${c[1].toFixed(1)} ${((c[0]+n2[0])/2).toFixed(1)} ${((c[1]+n2[1])/2).toFixed(1)}`;}
  return d+' Z';
}
function scribbleRect(w,h,seed,amp=1.35){
  const pt=[],per=[[0,0],[w,0],[w,h],[0,h]];
  for(let s=0;s<4;s++){const a=per[s],b=per[(s+1)%4],len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    const n=Math.max(3,Math.min(6,Math.round(len/72)));
    for(let i=0;i<n;i++){const t=i/n;
      pt.push([a[0]+(b[0]-a[0])*t+wob(seed+s*11+i*2.3,amp),a[1]+(b[1]-a[1])*t+wob(seed+s*17+i*3.1,amp)]);}}
  let d=`M ${(pt[0][0]+pt[pt.length-1][0])/2} ${(pt[0][1]+pt[pt.length-1][1])/2}`;
  for(let i=0;i<pt.length;i++){const c=pt[i],nx=pt[(i+1)%pt.length];
    d+=` Q ${c[0].toFixed(1)} ${c[1].toFixed(1)} ${((c[0]+nx[0])/2).toFixed(1)} ${((c[1]+nx[1])/2).toFixed(1)}`;}
  return d+' Z';
}
const PAD=11;
function paintFrame(el,fill,shadow,seed,amp=1.35,rayon){
  if(!el) return;
  const w=el.offsetWidth,h=el.offsetHeight; if(!w||!h) return;
  let svg=el.querySelector(':scope > svg.fr');
  if(!svg){svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','fr');svg.setAttribute('aria-hidden','true');el.insertBefore(svg,el.firstChild);}
  const W=w+PAD*2,H=h+PAD*2;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  Object.assign(svg.style,{left:-PAD+'px',top:-PAD+'px',width:W+'px',height:H+'px'});
  const d=rayon!==undefined?scribbleRound(w,h,rayon===-1?h/2:rayon,seed,amp):scribbleRect(w,h,seed,amp);
  svg.innerHTML=(shadow?`<path d="${d}" fill="${shadow}" opacity=".2" transform="translate(${PAD+3},${PAD+4})"/>`:'')
    +(fill?`<path d="${d}" fill="${fill}" stroke="${fill}" stroke-width="3.4" stroke-linejoin="round" transform="translate(${PAD-.6},${PAD+.5})"/>`:'')
    +`<path d="${d}" fill="none" stroke="#2A3229" stroke-width="2.2" stroke-linejoin="round" transform="translate(${PAD},${PAD})"/>`;
  svg.style.filter='url(#peint)';
  el._fr={fill,shadow,seed,amp,rayon}; el.classList.add('framed');
}

let ac=null;
function beep(f,d,t='square',v=.055){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}
}
const sfx={
  tick:()=>beep(1100,.012,'square',.014),
  valide:()=>beep(520,.06,'square',.04),
  manche:()=>{beep(620,.07);setTimeout(()=>beep(940,.11),65)},
  parfait:()=>[740,990,1240,1560].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.05),i*70)),
  win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*85))
};

/* ---------- nombres ---------- */
const NBSP=' ';
function grp(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,NBSP)}
function dec(v){return (Math.round(v*100)/100).toString().replace('.',',')}
/* écriture compacte : « 2,5 milliards » tient à l'écran là où
   « 2 500 000 000 » déborde, et se lit bien mieux à voix haute */
function fmt(n){
  const a=Math.abs(n);
  if(a>=1e9){const v=n/1e9;return dec(v)+' milliard'+(Math.abs(v)>=2?'s':'')}
  if(a>=1e6){const v=n/1e6;return dec(v)+' million'+(Math.abs(v)>=2?'s':'')}
  return Number.isInteger(n)?grp(n):dec(n);
}
/* pas d'arrondi « joli » : au-delà d'une vingtaine d'unités on reste sur des
   entiers (on ne compte pas 28,8 levers de soleil) */
function pas(q){
  const etendue=q.max-q.min, raw=etendue/120;
  const p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p;
  const s=(m<1.5?1:m<3.5?2:m<7.5?5:10)*p;
  return etendue>=20?Math.max(1,Math.round(s)):s;
}
function arrondi(v,q){const s=pas(q);return Math.max(q.min,Math.min(q.max,Math.round(v/s)*s))}

const slider=$('slider');
let drag=false,dernier=null;
function depuisX(clientX){
  const q=partie.deck[partie.manche],r=slider.getBoundingClientRect();
  let t=(clientX-r.left)/r.width; t=Math.max(0,Math.min(1,t));
  const v=arrondi(q.min+(q.max-q.min)*t,q);
  if(v!==dernier){dernier=v;sfx.tick();}
  partie.val=v; majVal();
}
slider.addEventListener('pointerdown',e=>{
  if(!partie||partie.fige) return;
  drag=true; slider.classList.add('grab');
  slider.setPointerCapture(e.pointerId); depuisX(e.clientX);
});
slider.addEventListener('pointermove',e=>{if(drag&&partie&&!partie.fige) depuisX(e.clientX)});
const finDrag=()=>{drag=false;slider.classList.remove('grab')};
slider.addEventListener('pointerup',finDrag);
slider.addEventListener('pointercancel',finDrag);
document.addEventListener('keydown',e=>{
  if(!partie||partie.fige||$('setupScreen').classList.contains('on')) return;
  const q=partie.deck[partie.manche],s=pas(q)*(e.shiftKey?10:1);
  if(e.key==='ArrowLeft'){partie.val=Math.max(q.min,partie.val-s);majVal();sfx.tick();e.preventDefault();}
  if(e.key==='ArrowRight'){partie.val=Math.min(q.max,partie.val+s);majVal();sfx.tick();e.preventDefault();}

/* ---------- révélation : qui est le plus proche ? ---------- */
function reveler(){
  partie.fige=true;
  const q=partie.deck[partie.manche], w=slider.clientWidth||300;
  $('knob').classList.add('cache');

  // la grande valeur cesse d'afficher la mise du dernier joueur : elle
  // devient la réponse, en vert — c'est le moment de bascule
  const txtV=fmt(q.n), elV=$('val');
  elV.innerHTML=txtV+`<small>${q.u}</small>`;
  elV.style.fontSize=(txtV.length<=7?52:txtV.length<=10?42:txtV.length<=14?34:28)+'px';
  elV.style.color='var(--vert)';

  // le vrai chiffre tombe sur la piste
  const tr=$('truth');
  tr.style.left=(((q.n-q.min)/(q.max-q.min))*w)+'px';
  $('truthLbl').textContent=fmt(q.n)+' '+q.u;
  tr.classList.add('on');

  // écart de chacun, du plus proche au plus loin
  const res=partie.mises.map(m=>({...m,ec:Math.abs(m.v-q.n)}));
  const mini=Math.min(...res.map(r=>r.ec));
  res.forEach(r=>{r.gagne=r.ec===mini});
  const tri=res.slice().sort((a,b)=>a.ec-b.ec);
  const vainqueurs=res.filter(r=>r.gagne);
  vainqueurs.forEach(r=>{joueurs[r.j].pts++});
  res.forEach(r=>{ // score de précision, départage en fin de partie
    const rel=r.ec/(q.max-q.min);
    joueurs[r.j].total += rel<=.015?100:Math.max(0,Math.round(100*(1-rel/.30)));
  });

  // pastilles sur la piste
  $('marks').innerHTML=res.map((r,k)=>{
    const j=joueurs[r.j], t=(r.v-q.min)/(q.max-q.min);
    return `<div class="mark ${r.gagne?'gagne':''}" style="left:${(t*w).toFixed(1)}px;--pc:${j.c};animation-delay:${.28+k*.09}s">
      <i></i><b>${j.nom.split(' ')[0]}</b></div>`;
  }).join('');

  // verdict
  const v=$('verdict');
  if(vainqueurs.length===joueurs.length && joueurs.length>1){
    v.textContent='Tout le monde à égalité !'; v.style.color='var(--moutarde)';
  }else if(vainqueurs.length>1){
    v.textContent=vainqueurs.map(r=>joueurs[r.j].nom).join(' et ')+' à égalité';
    v.style.color='var(--moutarde)';
  }else{
    v.textContent=joueurs[vainqueurs[0].j].nom+' remporte la manche';
    v.style.color='var(--vert)';
  }
  $('classement').innerHTML=tri.map(r=>{
    const j=joueurs[r.j];
    return `<div class="r ${r.gagne?'':'perdu'}" style="--pc:${j.c}">
      <i></i><span>${j.nom}</span>
      <span class="ec">${fmt(r.v)} · écart ${fmt(r.ec)}</span>
      <span class="pt">${r.gagne?'+1':''}</span></div>`;
  }).join('');
  $('explainText').textContent=q.e;
  const dernier=partie.manche===partie.deck.length-1;
  $('nextBtn').querySelector('.lbl').textContent=dernier?'Voir le classement':'Manche suivante';
  paintFrame($('nextBtn'),HEX.rouge,HEX.encre,partie.manche*41+9);
  peindre();

  // pile dessus : le tampon
  const parfait=res.some(r=>r.ec/(q.max-q.min)<=.015);
  if(parfait){ tamponner(); sfx.parfait(); } else sfx.manche();
  setTimeout(()=>$('explain').classList.add('on'),parfait?700:520);
}
function tamponner(){
  const s=$('stamp'); if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  s.classList.remove('on'); void s.offsetWidth; s.classList.add('on');
  try{ if(navigator.vibrate) navigator.vibrate(18); }catch(e){}
}
$('nextBtn').addEventListener('click',()=>{
  $('nextBtn').blur();
  $('explain').classList.remove('on');
  if(partie.manche===partie.deck.length-1) return setTimeout(terminer,220);
  partie.manche++;
  setTimeout(demarrerManche,220);
});

/* ---------- fin de partie ---------- */
function terminer(){
  document.querySelector('.app').scrollTop=0;
  const cl=joueurs.map((j,i)=>({...j,i})).sort((a,b)=>b.pts-a.pts||b.total-a.total);
  const tete=cl[0], exaequo=cl.filter(j=>j.pts===tete.pts&&j.total===tete.total);

  $('resultTitle').textContent = exaequo.length>1

      <span class="rg">${k+1}${k===0?'ᵉʳ':'ᵉ'}</span><i></i><span>${j.nom}</span>
      <span class="sc">${j.pts} manche${j.pts>1?'s':''}</span></div>`).join('');
  requestAnimationFrame(()=>{
    document.querySelectorAll('#podium .r').forEach((el,k)=>
      paintFrame(el,k===0?HEX.jaune:HEX.papier,HEX.encre,k*19+7,1.2,10));

}
function confetti(){
  const box=$('confetti'); box.innerHTML='';

  const cols=['#E03B26','#F2C64B','#79A257','#E8897A','#2C6E7F','#4FA8A0','#E6A93C','#B5533C'];
  for(let i=0;i<32;i++){
    const el=document.createElement('i');
    el.style.left=Math.random()*100+'%';

  $('setupScreen').classList.add('on');
  renderSetup();
});

/* ---------- démarrage ---------- */
renderSetup();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>setTimeout(renderSetup,60));
let rid; window.addEventListener('resize',()=>{clearTimeout(rid);rid=setTimeout(()=>{
  if(partie&&!$('setupScreen').classList.contains('on')){dessinerPiste();majVal();peindre();}
  else renderSetup();
},150)});
</script>
</body>
